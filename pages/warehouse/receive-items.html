<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ຮັບເຄື່ອງເຂົ້າສາງ - Water Meter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> 
        * { font-family: 'Times New Roman', 'Phetsarath OT', serif; }
        body { background-color: #f8fafc; overflow-x: hidden; }
        .page-animate { animation: pageEnter 0.5s ease-out forwards; }
        @keyframes pageEnter { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex min-h-screen relative">
    
    <div id="sidebar-container" class="w-64 flex-shrink-0 z-50 relative"></div>
    <script src="../../js/components/sidebar.js" defer></script>
    <script type="module" src="../../js/components/auth-guard.js"></script>

    <main class="flex-1 p-8 ml-64 overflow-y-auto space-y-6 page-animate">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-200 pb-5">
            <div class="flex items-start space-x-4">
                <div class="bg-gradient-to-br from-emerald-500 to-teal-600 p-3 rounded-2xl text-white shadow-lg shadow-emerald-500/30">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                </div>
                <div>
                    <h2 class="text-2xl font-extrabold text-slate-800 tracking-wide">ຮັບເຄື່ອງເຂົ້າສາງ (Receive)</h2>
                    <p class="text-slate-500 mt-1 text-sm">ບັນທຶກການຮັບອຸປະກອນໃໝ່ເຂົ້າສູ່ລະບົບສະຕັອກ</p>
                </div>
            </div>
            
            <div class="flex gap-3">
                <button class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-bold py-2.5 px-4 rounded-xl shadow-sm transition-all flex items-center">
                    <svg class="w-5 h-5 mr-2 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    ປະຫວັດການຮັບເຄື່ອງ
                </button>
                <button id="btnSaveReceive" onclick="saveReceiveData()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold py-2.5 px-6 rounded-xl shadow-lg shadow-emerald-500/30 active:scale-95 transition-all flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                    ບັນທຶກຮັບເຄື່ອງ
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
            <h3 class="text-base font-bold text-slate-800 mb-4 border-l-4 border-emerald-500 pl-3">ຂໍ້ມູນເອກະສານອ້າງອີງ</h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-xs font-bold text-slate-600">ເລກທີໃບຮັບເຄື່ອງ <span id="req-docRef" class="text-rose-500">*</span></label>
                        <label class="flex items-center space-x-1 cursor-pointer" title="ຕິກເພື່ອປິດການນຳໃຊ້ຫ້ອງນີ້ຊົ່ວຄາວ">
                            <input type="checkbox" id="skipDocRef" onchange="toggleFieldState('docRef', this.checked)" class="w-3.5 h-3.5 rounded border-slate-300 text-slate-400 focus:ring-slate-400">
                            <span class="text-[10px] font-bold text-slate-400">ບໍ່ລະບຸ</span>
                        </label>
                    </div>
                    <input type="text" id="docRef" placeholder="ຕົວຢ່າງ: REC-2607-001" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500/50 outline-none uppercase font-bold text-slate-700 transition-all">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">ວັນທີຮັບເຄື່ອງ <span class="text-rose-500">*</span></label>
                    <input type="date" id="receiveDate" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500/50 outline-none">
                </div>
                
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-xs font-bold text-slate-600">ຜູ້ສະໜອງ / ບໍລິສັດ <span id="req-supplierName" class="text-rose-500">*</span></label>
                        <label class="flex items-center space-x-1 cursor-pointer" title="ຕິກເພື່ອປິດການນຳໃຊ້ຫ້ອງນີ້ຊົ່ວຄາວ">
                            <input type="checkbox" id="skipSupplier" onchange="toggleFieldState('supplierName', this.checked)" class="w-3.5 h-3.5 rounded border-slate-300 text-slate-400 focus:ring-slate-400">
                            <span class="text-[10px] font-bold text-slate-400">ບໍ່ລະບຸ</span>
                        </label>
                    </div>
                    <input type="text" id="supplierName" placeholder="ຊື່ຮ້ານຄ້າ ຫຼື ບໍລິສັດທີ່ສົ່ງເຄື່ອງ" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500/50 outline-none transition-all">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">ຜູ້ຮັບເຄື່ອງ (ພະນັກງານ)</label>
                    <input type="text" id="receiverName" disabled class="w-full p-2.5 border border-slate-200 bg-slate-50 rounded-xl text-sm font-bold text-emerald-700 cursor-not-allowed">
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                <h3 class="text-base font-bold text-slate-800 border-l-4 border-emerald-500 pl-3">ລາຍການອຸປະກອນ</h3>
                <button onclick="addTableRow()" class="text-emerald-600 bg-emerald-50 hover:bg-emerald-100 px-4 py-2 rounded-lg text-xs font-bold flex items-center transition-colors">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                    ເພີ່ມລາຍການ
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead class="bg-slate-100/50">
                        <tr class="text-slate-500 text-xs border-b border-slate-200">
                            <th class="p-3 font-semibold text-center w-12">ລ/ດ</th>
                            <th class="p-3 font-semibold w-64">ລະຫັດວັດຖຸ (ພິມ ຫຼື ເລືອກ) <span class="text-rose-500">*</span></th>
                            <th class="p-3 font-semibold">ຊື່ອຸປະກອນ (ອັດຕະໂນມັດ)</th>
                            <th class="p-3 font-semibold text-center w-32">ຈຳນວນຮັບ <span class="text-rose-500">*</span></th>
                            <th class="p-3 font-semibold w-48">ໝາຍເຫດ</th>
                            <th class="p-3 font-semibold text-center w-16">ລຶບ</th>
                        </tr>
                    </thead>
                    <tbody id="receiveTableBody" class="divide-y divide-slate-100">
                        </tbody>
                </table>
            </div>
        </div>
        
    </main>

    <datalist id="materialsList"></datalist>

    <script type="module">
        import { db } from '../../firebase-config.js';
        import { collection, getDocs, doc, writeBatch, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. ຕັ້ງຄ່າຂໍ້ມູນຜູ້ຮັບເຄື່ອງ (ດຶງຈາກຜູ້ລັອກອິນ)
        const userDataStr = localStorage.getItem('wm_user_data');
        const userData = userDataStr ? JSON.parse(userDataStr) : {};
        document.getElementById('receiverName').value = userData.fullName || 'ແອດມິນລະບົບ';
        document.getElementById('receiveDate').valueAsDate = new Date();

        // 2. ຕົວແປເກັບຂໍ້ມູນ Master Data ຈາກສະຕັອກ
        let masterMaterials = [];

        // 3. ດຶງຂໍ້ມູນລາຍຊື່ອຸປະກອນຈາກ Firebase
        async function loadMaterialsForAutocomplete() {
            try {
                const snap = await getDocs(collection(db, "materials"));
                const datalist = document.getElementById('materialsList');
                datalist.innerHTML = ''; 

                snap.forEach(doc => {
                    const data = doc.data();
                    masterMaterials.push({
                        id: doc.id,
                        itemCode: data.itemCode,
                        itemName: data.itemName,
                        unit: data.unit || 'ອັນ'
                    });

                    const option = document.createElement('option');
                    option.value = data.itemCode;
                    option.textContent = data.itemName;
                    datalist.appendChild(option);
                });

                if(document.getElementById('receiveTableBody').children.length === 0) {
                    addTableRow();
                }

            } catch (error) {
                console.error("Error loading materials: ", error);
            }
        }

        // 🟢 ຟັງຊັນສຳລັບປິດ/ເປີດ ຫ້ອງຂໍ້ມູນ (ຕິກສີເທົາ) 🟢
        window.toggleFieldState = function(fieldId, isSkipped) {
            const input = document.getElementById(fieldId);
            const reqStar = document.getElementById('req-' + fieldId);
            if (isSkipped) {
                // ເມື່ອຕິກປິດ
                input.disabled = true;
                input.value = '';
                input.classList.add('bg-slate-100', 'text-slate-400', 'cursor-not-allowed', 'border-dashed');
                input.classList.remove('focus:ring-2', 'focus:ring-emerald-500/50');
                if(reqStar) reqStar.style.display = 'none';
            } else {
                // ເມື່ອຕິກເປີດໃຊ້ງານຄືນ
                input.disabled = false;
                input.classList.remove('bg-slate-100', 'text-slate-400', 'cursor-not-allowed', 'border-dashed');
                input.classList.add('focus:ring-2', 'focus:ring-emerald-500/50');
                if(reqStar) reqStar.style.display = 'inline';
            }
        };

        // 4. ຟັງຊັນສ້າງແຖວໃໝ່
        window.addTableRow = function() {
            const tbody = document.getElementById('receiveTableBody');
            const rowCount = tbody.children.length + 1;
            const tr = document.createElement('tr');
            tr.className = "hover:bg-slate-50 transition-colors receive-row";
            
            tr.innerHTML = `
                <td class="p-3 text-center font-bold text-slate-400 row-number">${rowCount}</td>
                <td class="p-3">
                    <input type="text" list="materialsList" onchange="autoFillItemDetails(this)" placeholder="ພິມລະຫັດ..." class="input-code w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 outline-none uppercase font-bold text-indigo-600">
                    <input type="hidden" class="input-doc-id">
                </td>
                <td class="p-3">
                    <div class="flex items-center">
                        <input type="text" disabled placeholder="ເລືອກລະຫັດກ່ອນ" class="input-name w-full p-2 border border-transparent bg-transparent text-sm font-medium text-slate-700">
                        <span class="input-unit text-xs text-slate-400 ml-2 w-12">-</span>
                    </div>
                </td>
                <td class="p-3 text-center">
                    <input type="number" min="1" placeholder="0" class="input-qty w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 outline-none text-center font-bold">
                </td>
                <td class="p-3">
                    <input type="text" placeholder="..." class="input-note w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 outline-none">
                </td>
                <td class="p-3 text-center">
                    <button onclick="removeTableRow(this)" class="text-slate-400 hover:text-rose-500 transition-colors p-1.5 rounded-lg hover:bg-rose-50">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
            updateRowNumbers();
        };

        // 5. ຟັງຊັນ Auto Fill (ດຶງຊື່ມາໃສ່ອັດຕະໂນມັດເມື່ອພິມລະຫັດ)
        window.autoFillItemDetails = function(inputElement) {
            const row = inputElement.closest('tr');
            const code = inputElement.value.trim().toUpperCase();
            
            const nameInput = row.querySelector('.input-name');
            const unitSpan = row.querySelector('.input-unit');
            const docIdInput = row.querySelector('.input-doc-id');

            const matchedItem = masterMaterials.find(m => m.itemCode.toUpperCase() === code);

            if (matchedItem) {
                nameInput.value = matchedItem.itemName;
                unitSpan.textContent = matchedItem.unit;
                docIdInput.value = matchedItem.id; 
                inputElement.classList.remove('border-rose-400', 'text-rose-500');
                inputElement.classList.add('border-emerald-400', 'text-emerald-700');
            } else {
                nameInput.value = 'ບໍ່ພົບລະຫັດນີ້ໃນລະບົບ!';
                unitSpan.textContent = '-';
                docIdInput.value = '';
                inputElement.classList.add('border-rose-400', 'text-rose-500');
            }
        };

        // 6. ຟັງຊັນລຶບແຖວ ແລະ ຈັດລຽງເລກລຳດັບໃໝ່
        window.removeTableRow = function(btn) {
            const tbody = document.getElementById('receiveTableBody');
            if(tbody.children.length > 1) {
                btn.closest('tr').remove();
                updateRowNumbers();
            } else {
                alert("ຕ້ອງມີຢ່າງໜ້ອຍ 1 ລາຍການ");
            }
        };

        function updateRowNumbers() {
            const rows = document.querySelectorAll('.receive-row');
            rows.forEach((row, index) => {
                row.querySelector('.row-number').textContent = index + 1;
            });
        }

        // 7. 🟢 ຟັງຊັນບັນທຶກ ແລະ ຕັດສະຕັອກ (Batch Write) 🟢
        window.saveReceiveData = async function() {
            const btn = document.getElementById('btnSaveReceive');
            
            // ກວດສອບສະຖານະການຕິກ ບໍ່ລະບຸ
            const skipDocRef = document.getElementById('skipDocRef').checked;
            const skipSupplier = document.getElementById('skipSupplier').checked;

            // ຖ້າຕິກບໍ່ລະບຸ ໃຫ້ສົ່ງຄ່າເປັນ '-' ແທນ
            const docRefVal = skipDocRef ? '-' : document.getElementById('docRef').value.trim();
            const supplierVal = skipSupplier ? '-' : document.getElementById('supplierName').value.trim();
            const dateVal = document.getElementById('receiveDate').value;
            const receiverVal = document.getElementById('receiverName').value;

            // ກວດສອບຂໍ້ມູນເອກະສານ
            if (!docRefVal || !dateVal || !supplierVal) {
                return alert("ກະລຸນາປ້ອນ ຂໍ້ມູນເອກະສານອ້າງອີງ ໃຫ້ຄົບຖ້ວນ (ຫຼື ຕິກ 'ບໍ່ລະບຸ')!");
            }

            const rows = document.querySelectorAll('.receive-row');
            let itemsToReceive = [];
            let hasError = false;

            // ກວດສອບຂໍ້ມູນແຕ່ລະແຖວ
            rows.forEach(row => {
                const code = row.querySelector('.input-code').value.trim();
                const docId = row.querySelector('.input-doc-id').value;
                const qtyStr = row.querySelector('.input-qty').value;
                const qty = parseInt(qtyStr);
                const note = row.querySelector('.input-note').value.trim();

                if (code !== "") {
                    if (!docId) {
                        alert(`ລະຫັດອຸປະກອນ "${code}" ບໍ່ຖືກຕ້ອງ! ກະລຸນາເລືອກຈາກລາຍຊື່.`);
                        hasError = true;
                    } else if (isNaN(qty) || qty <= 0) {
                        alert(`ກະລຸນາປ້ອນຈຳນວນຮັບ ສຳລັບລະຫັດ "${code}" ໃຫ້ຖືກຕ້ອງ (>0).`);
                        hasError = true;
                    } else {
                        itemsToReceive.push({
                            materialDocId: docId,
                            itemCode: code,
                            itemName: row.querySelector('.input-name').value,
                            quantity: qty,
                            note: note
                        });
                    }
                }
            });

            if (hasError) return;
            if (itemsToReceive.length === 0) return alert("ກະລຸນາເພີ່ມຢ່າງໜ້ອຍ 1 ລາຍການອຸປະກອນ!");

            btn.disabled = true;
            btn.innerHTML = 'ກຳລັງບັນທຶກ...';

            try {
                const batch = writeBatch(db);

                // 1. ສ້າງປະຫວັດການຮັບເຄື່ອງ (Receipt History)
                const receiptRef = doc(collection(db, "receipt_history"));
                batch.set(receiptRef, {
                    documentRef: docRefVal,
                    receiveDate: dateVal,
                    supplier: supplierVal,
                    receiverName: receiverVal,
                    totalItems: itemsToReceive.length,
                    items: itemsToReceive,
                    createdAt: serverTimestamp()
                });

                // 2. ອັບເດດຍອດສະຕັອກ (Inventory)
                itemsToReceive.forEach(item => {
                    const materialRef = doc(db, "materials", item.materialDocId);
                    batch.update(materialRef, { 
                        stockQuantity: increment(item.quantity) 
                    });
                });

                // 3. ຢືນຢັນການບັນທຶກ
                await batch.commit();

                alert("✅ ບັນທຶກການຮັບເຄື່ອງເຂົ້າສາງ ສຳເລັດແລ້ວ! (ຍອດສະຕັອກຖືກອັບເດດອັດຕະໂນມັດ)");
                
                // ລ້າງໜ້າຈໍເພື່ອກຽມຮັບບິນໃໝ່
                document.getElementById('docRef').value = '';
                document.getElementById('supplierName').value = '';
                
                // ປົດຕິກໃຫ້ກັບມາເປັນປົກກະຕິ
                document.getElementById('skipDocRef').checked = false;
                document.getElementById('skipSupplier').checked = false;
                window.toggleFieldState('docRef', false);
                window.toggleFieldState('supplierName', false);

                document.getElementById('receiveTableBody').innerHTML = '';
                addTableRow();

            } catch (error) {
                console.error("Error saving receive data: ", error);
                alert("❌ ເກີດຂໍ້ຜິດພາດໃນການບັນທຶກ: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg> ບັນທຶກຮັບເຄື່ອງ`;
            }
        };

        loadMaterialsForAutocomplete();

    </script>
</body>
</html>
