<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ເບີກເຄື່ອງໃຫ້ຊ່າງ - Water Meter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../js/components/notifications.js"></script>
    <style> 
        * { font-family: 'Times New Roman', 'Phetsarath OT', serif; }
        body { background-color: #f8fafc; overflow-x: hidden; }
        .page-animate { animation: pageEnter 0.5s ease-out forwards; }
        @keyframes pageEnter { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex min-h-screen relative">
    
    <div id="sidebar-container" class="w-64 flex-shrink-0 z-50 relative"></div>
    <script src="../../js/components/sidebar.js" defer></script>
    <script type="module" src="../../js/components/auth-guard.js"></script>

    <main class="flex-1 p-8 ml-64 overflow-y-auto space-y-6 page-animate">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-200 pb-5">
            <div class="flex items-start space-x-4">
                <div class="bg-gradient-to-br from-amber-500 to-orange-600 p-3 rounded-2xl text-white shadow-lg shadow-amber-500/30">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                </div>
                <div>
                    <h2 class="text-2xl font-extrabold text-slate-800 tracking-wide">ເບີກເຄື່ອງໃຫ້ຊ່າງ (Create Issue Ticket)</h2>
                    <p class="text-slate-500 mt-1 text-sm">ສ້າງໃບເບີກເຄື່ອງອອກຈາກສາງ ເພື່ອສົ່ງຕໍ່ໃຫ້ພາກສ່ວນປ່ຽນຖ່າຍໄປລົງຂໍ້ມູນ</p>
                </div>
            </div>
            
            <button id="btnSaveIssue" onclick="saveIssueData()" class="bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold py-2.5 px-6 rounded-xl shadow-lg shadow-amber-500/30 active:scale-95 transition-all flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                ສ້າງໃບເບີກ (ສົ່ງໃຫ້ຊ່າງ)
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
            <h3 class="text-base font-bold text-slate-800 mb-4 border-l-4 border-amber-500 pl-3">ຂໍ້ມູນໃບເບີກ / ໃບປ່ຽນຖ່າຍ</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">ເລກທີໃບເບີກ <span class="text-rose-500">*</span></label>
                    <input type="text" id="docRef" placeholder="ຕົວຢ່າງ: ISS-2026-001" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-amber-500/50 outline-none uppercase font-bold text-slate-700">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">ວັນທີເບີກເຄື່ອງ <span class="text-rose-500">*</span></label>
                    <input type="date" id="issueDate" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-amber-500/50 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">ພາກສ່ວນ / ໜ່ວຍງານຊ່າງ <span class="text-rose-500">*</span></label>
                    <select id="teamName" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-amber-500/50 outline-none cursor-pointer">
                        <option value="">-- ເລືອກພາກສ່ວນຊ່າງ --</option>
                        <option value="ໜ່ວຍງານປ່ຽນຖ່າຍ ທີ 1">ໜ່ວຍງານປ່ຽນຖ່າຍ ທີ 1</option>
                        <option value="ໜ່ວຍງານປ່ຽນຖ່າຍ ທີ 2">ໜ່ວຍງານປ່ຽນຖ່າຍ ທີ 2</option>
                        <option value="ໜ່ວຍງານປ່ຽນຖ່າຍ ທີ 3">ໜ່ວຍງານປ່ຽນຖ່າຍ ທີ 3</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                <h3 class="text-base font-bold text-slate-800 border-l-4 border-amber-500 pl-3">ລາຍການອຸປະກອນທີ່ສາງເບີກໃຫ້ຈິງ</h3>
                <button onclick="addTableRow()" class="text-amber-600 bg-amber-50 hover:bg-amber-100 px-4 py-2 rounded-lg text-xs font-bold flex items-center transition-colors">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                    ເພີ່ມລາຍການ
                </button>
            </div>
            
            <div class="overflow-x-auto min-h-[40vh]">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead class="bg-slate-100/50">
                        <tr class="text-slate-500 text-xs border-b border-slate-200">
                            <th class="p-3 font-semibold text-center w-12">ລ/ດ</th>
                            <th class="p-3 font-semibold w-64">ລະຫັດວັດຖຸ <span class="text-rose-500">*</span></th>
                            <th class="p-3 font-semibold">ຊື່ອຸປະກອນ</th>
                            <th class="p-3 font-semibold text-center w-32">ສະຕັອກເຫຼືອ</th>
                            <th class="p-3 font-semibold text-center w-32 bg-emerald-50 text-emerald-700">ຈຳນວນ(ສາງຈ່າຍ) <span class="text-rose-500">*</span></th>
                            <th class="p-3 font-semibold text-center w-16">ລຶບ</th>
                        </tr>
                    </thead>
                    <tbody id="issueTableBody" class="divide-y divide-slate-100">
                        </tbody>
                </table>
            </div>
        </div>
        
    </main>

    <datalist id="materialsList"></datalist>

    <script type="module">
        import { db } from '../../firebase-config.js';
        import { collection, getDocs, doc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        document.getElementById('issueDate').valueAsDate = new Date();
        let masterMaterials = [];

        // ໂຫຼດລາຍຊື່ອຸປະກອນມາໄວ້ຄົ້ນຫາ
        async function loadMaterialsForAutocomplete() {
            try {
                const snap = await getDocs(collection(db, "materials"));
                const datalist = document.getElementById('materialsList');
                datalist.innerHTML = ''; 

                snap.forEach(doc => {
                    const data = doc.data();
                    masterMaterials.push({
                        id: doc.id,
                        itemCode: data.itemCode,
                        itemName: data.itemName,
                        stock: data.stockQuantity || 0,
                        unit: data.unit || 'ອັນ'
                    });
                    const option = document.createElement('option');
                    option.value = data.itemCode;
                    option.textContent = data.itemName;
                    datalist.appendChild(option);
                });

                if(document.getElementById('issueTableBody').children.length === 0) addTableRow();

            } catch (error) { console.error("Error:", error); }
        }

        // ສ້າງແຖວ
        window.addTableRow = function() {
            const tbody = document.getElementById('issueTableBody');
            const rowCount = tbody.children.length + 1;
            const tr = document.createElement('tr');
            tr.className = "hover:bg-slate-50 transition-colors issue-row";
            
            tr.innerHTML = `
                <td class="p-3 text-center font-bold text-slate-400 row-number">${rowCount}</td>
                <td class="p-3">
                    <input type="text" list="materialsList" onchange="autoFillItemDetails(this)" placeholder="ພິມລະຫັດ..." class="input-code w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-1 focus:ring-amber-500 outline-none uppercase font-bold text-indigo-600">
                    <input type="hidden" class="input-doc-id">
                </td>
                <td class="p-3">
                    <input type="text" disabled placeholder="ອັດຕະໂນມັດ..." class="input-name w-full p-2 border border-transparent bg-transparent text-sm font-medium text-slate-700">
                </td>
                <td class="p-3 text-center">
                    <span class="input-stock font-bold text-slate-500">-</span>
                </td>
                <td class="p-3 text-center bg-emerald-50/50">
                    <input type="number" min="1" placeholder="0" class="input-qty-wh w-full p-2 border border-emerald-300 rounded-lg text-sm focus:ring-1 focus:ring-emerald-500 outline-none text-center font-bold text-emerald-700">
                </td>
                <td class="p-3 text-center">
                    <button onclick="removeTableRow(this)" class="text-slate-400 hover:text-rose-500 transition-colors p-1.5 rounded-lg hover:bg-rose-50">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
            updateRowNumbers();
        };

        // Auto Fill
        window.autoFillItemDetails = function(inputElement) {
            const row = inputElement.closest('tr');
            const code = inputElement.value.trim().toUpperCase();
            
            const nameInput = row.querySelector('.input-name');
            const docIdInput = row.querySelector('.input-doc-id');
            const stockSpan = row.querySelector('.input-stock');

            const matchedItem = masterMaterials.find(m => m.itemCode.toUpperCase() === code);

            if (matchedItem) {
                nameInput.value = matchedItem.itemName;
                docIdInput.value = matchedItem.id; 
                stockSpan.textContent = matchedItem.stock + ' ' + matchedItem.unit;
                inputElement.classList.remove('border-rose-400', 'text-rose-500');
                inputElement.classList.add('border-emerald-400', 'text-emerald-700');
                
                // ແຈ້ງເຕືອນຖ້າສະຕັອກໝົດ
                if(matchedItem.stock <= 0) {
                    stockSpan.classList.replace('text-slate-500', 'text-rose-500');
                    alert(`⚠️ ແຈ້ງເຕືອນ: ວັດຖຸນີ້ໝົດສະຕັອກແລ້ວ (ຍອດເຫຼືອ 0)`);
                }
            } else {
                nameInput.value = 'ບໍ່ພົບລະຫັດ!';
                docIdInput.value = '';
                stockSpan.textContent = '-';
                inputElement.classList.add('border-rose-400', 'text-rose-500');
            }
        };

        window.removeTableRow = function(btn) {
            const tbody = document.getElementById('issueTableBody');
            if(tbody.children.length > 1) {
                btn.closest('tr').remove();
                updateRowNumbers();
            } else { alert("ຕ້ອງມີຢ່າງໜ້ອຍ 1 ລາຍການ"); }
        };

        function updateRowNumbers() {
            const rows = document.querySelectorAll('.issue-row');
            rows.forEach((row, index) => { row.querySelector('.row-number').textContent = index + 1; });
        }

        // 🟢 ບັນທຶກສ້າງໃບເບີກ (ໄປໄວ້ລໍຖ້າໃຫ້ຊ່າງລົງຂໍ້ມູນ) 🟢
        window.saveIssueData = async function() {
            const btn = document.getElementById('btnSaveIssue');
            const docRefVal = document.getElementById('docRef').value.trim();
            const dateVal = document.getElementById('issueDate').value;
            const teamVal = document.getElementById('teamName').value;

            if (!docRefVal || !dateVal || !teamVal) {
                return alert("ກະລຸນາປ້ອນ ຂໍ້ມູນໃບເບີກ ໃຫ້ຄົບຖ້ວນ!");
            }

            const rows = document.querySelectorAll('.issue-row');
            let itemsToIssue = [];
            let hasError = false;

            rows.forEach(row => {
                const code = row.querySelector('.input-code').value.trim();
                const docId = row.querySelector('.input-doc-id').value;
                const qtyWh = parseInt(row.querySelector('.input-qty-wh').value); // ຈຳນວນທີ່ສາງຈ່າຍ

                if (code !== "") {
                    if (!docId) {
                        alert(`ລະຫັດອຸປະກອນ "${code}" ບໍ່ຖືກຕ້ອງ!`);
                        hasError = true;
                    } else if (isNaN(qtyWh) || qtyWh <= 0) {
                        alert(`ກະລຸນາປ້ອນຈຳນວນທີ່ສາງຈ່າຍ ສຳລັບລະຫັດ "${code}" ໃຫ້ຖືກຕ້ອງ.`);
                        hasError = true;
                    } else {
                        itemsToIssue.push({
                            materialDocId: docId,
                            itemCode: code,
                            itemName: row.querySelector('.input-name').value,
                            qtyWarehouse: qtyWh, // ສາງປ້ອນ
                            qtyField: 0 // ຊ່າງຍັງບໍ່ທັນປ້ອນ ໃຫ້ເລີ່ມຕົ້ນເປັນ 0 ໄວ້ກ່ອນ
                        });
                    }
                }
            });

            if (hasError) return;
            if (itemsToIssue.length === 0) return alert("ກະລຸນາເພີ່ມຢ່າງໜ້ອຍ 1 ລາຍການ!");

            btn.disabled = true; btn.innerHTML = 'ກຳລັງບັນທຶກ...';

            try {
                // ບັນທຶກລົງ Collection ສົມທຽບ ໂດຍຕັ້ງສະຖານະເປັນ 'issued'
                await addDoc(collection(db, "reconcile_tickets"), {
                    docRef: docRefVal,
                    issueDate: dateVal,
                    teamName: teamVal,
                    status: 'issued', // ສະຖານະ: ສາງຈ່າຍແລ້ວ ລໍຖ້າຊ່າງລາຍງານ
                    items: itemsToIssue,
                    createdAt: serverTimestamp()
                });

                alert("✅ ສ້າງໃບເບີກເຄື່ອງສຳເລັດ! ເອກະສານນີ້ຖືກສົ່ງໄປຫາໜ້າຈໍຂອງຊ່າງແລ້ວ.");
                
                // ລ້າງໜ້າຈໍ
                document.getElementById('docRef').value = '';
                document.getElementById('teamName').value = '';
                document.getElementById('issueTableBody').innerHTML = '';
                addTableRow();

            } catch (error) {
                console.error("Error:", error); alert("❌ ຜິດພາດ: " + error.message);
            } finally {
                btn.disabled = false; btn.innerHTML = 'ສ້າງໃບເບີກ (ສົ່ງໃຫ້ຊ່າງ)';
            }
        };

        loadMaterialsForAutocomplete();

    </script>
</body>
</html>
